<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>MB 메타 소재 보드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&display=swap">
<style>
/* 업무형 보드: 일자 구획을 굵은 선으로 나누고, 카드는 이미지 + 복사 필드 */
:root{
  --bg:#ffffff; --fg:#141414; --muted:#6b6b6b; --line:#e3e3e3; --strong:#141414;
  --inv-bg:#141414; --inv-fg:#ffffff; --warn:#d1281f; --chip:#f3f3f3;
  --sans:"Pretendard","Noto Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121212; --fg:#ededed; --muted:#9a9a9a; --line:#2c2c2c; --strong:#ededed;
  --inv-bg:#ededed; --inv-fg:#121212; --warn:#ff6b61; --chip:#1e1e1e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121212; --fg:#ededed; --muted:#9a9a9a; --line:#2c2c2c; --strong:#ededed;
  --inv-bg:#ededed; --inv-fg:#121212; --warn:#ff6b61; --chip:#1e1e1e; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;line-height:1.55;letter-spacing:0}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:32px 64px;max-width:1680px;margin:0 auto}
h1{font-size:28px;font-weight:700;margin:0 0 20px;text-wrap:balance}
dl.sum{display:grid;grid-template-columns:max-content 1fr;gap:6px 24px;margin:0 0 28px}
dl.sum dt{color:var(--muted);font-size:12px}
dl.sum dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums;min-width:0;overflow-wrap:anywhere}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.btn{font:inherit;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:6px 10px;border-radius:4px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--strong)}
.btn:focus-visible{outline:2px solid var(--strong);outline-offset:2px}
.btn[aria-pressed="true"]{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.jump{display:flex;gap:4px;flex-wrap:wrap}
.jump{order:-1;flex-basis:100%;overflow-x:auto;flex-wrap:nowrap;padding-bottom:2px}
.day{border-top:3px solid var(--strong);margin-top:24px;padding-top:14px;scroll-margin-top:72px}
.dayhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:16px}
.dayhead h2{font-size:18px;font-weight:700;margin:0;font-variant-numeric:tabular-nums}
.dayhead .meta{color:var(--muted);font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:28px 24px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.card.new .thumb{outline:2px solid var(--strong);outline-offset:-2px}
.thumb{display:block;width:100%;padding:0;border:0;background:var(--chip);border-radius:2px;overflow:hidden;cursor:zoom-in}
.thumb:focus-visible{outline:2px solid var(--strong);outline-offset:2px}
.lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.lb[hidden]{display:none}
.lb-in{display:flex;flex-direction:column;gap:10px;max-width:min(1080px,100%);max-height:100%;min-width:0}
.lb-in img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain;display:block;margin:0 auto}
.lb-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:#fff;font-size:12px;font-weight:600;min-width:0}
.lb-bar #lb-name{overflow-wrap:anywhere;min-width:0}
.btn.inv{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.lb .btn{background:#fff;color:#141414;border-color:#fff}
.lb .btn.inv{background:#141414;color:#fff;border-color:#fff}
.thumb img{display:block;width:100%;height:auto;max-width:100%}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:12px;font-weight:600;border:1px solid var(--line);padding:1px 7px;border-radius:3px}
.tag.inv{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg)}
.tag.warn{color:var(--warn);border-color:var(--warn)}
.f{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:start;border-top:1px solid var(--line);padding-top:8px}
.f .k{grid-column:1/-1;color:var(--muted);font-size:12px}
.f .v{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
.f .v.b{font-weight:700;font-size:15px}
.f .v.empty{color:var(--muted)}
.f .cp{align-self:start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.state{color:var(--muted);padding-block:40px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--inv-bg);color:var(--inv-fg);font-size:12px;font-weight:600;padding:8px 14px;border-radius:4px;opacity:0;transition:opacity .15s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media (max-width:480px){.grid{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <h1>MB 메타 소재 보드</h1>

  <div class="bar" aria-label="보기">
    <div class="seg" id="f-gender" role="group" aria-label="구분">
      <button class="btn" aria-pressed="true" data-g="">전체</button>
      <button class="btn" aria-pressed="false" data-g="남성">남성</button>
      <button class="btn" aria-pressed="false" data-g="여성">여성</button>
    </div>
    <div class="jump" id="jump" role="tablist" aria-label="게시일"></div>
  </div>

  <div id="list"><p class="state" id="state">소재를 불러오는 중</p></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="lb" id="lb" hidden role="dialog" aria-modal="true" aria-label="소재 확대">
  <div class="lb-in">
    <img id="lb-img" alt=""><video id="lb-vid" controls playsinline hidden style="max-width:100%;max-height:calc(100vh - 120px);display:block;margin:0 auto;background:#000"></video>
    <div class="lb-bar"><span id="lb-name"></span><span class="acts"><button class="btn inv" id="lb-dl" type="button">다운로드</button><button class="btn" id="lb-close" type="button">닫기</button></span></div>
  </div>
</div>

<script>
(() => {
  const WD = ["일","월","화","수","목","금","토"];
  const $ = (s, r=document) => r.querySelector(s);
  const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
  let rows = [], gender = "", dl = null, day = "";

  const fmtDay = d => { const [y,m,dd] = d.split("-").map(Number); const w = WD[new Date(y, m-1, dd).getDay()]; return `${m}/${dd}(${w})`; };
  const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("on"), 1400); };

  async function copy(text, node){
    try { await navigator.clipboard.writeText(text); toast("복사됨"); }
    catch(e){ const r = document.createRange(); r.selectNodeContents(node); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("선택됨, Ctrl+C로 복사"); }
  }

  function field(k, v, opts={}){
    const f = el("div","f");
    f.append(el("div","k",k));
    const has = v != null && String(v).trim() !== "";
    const val = el("div","v" + (opts.b ? " b" : "") + (has ? "" : " empty"), has ? v : (opts.empty || "-"));
    f.append(val);
    if (has && opts.copy !== false){ const b = el("button","btn cp","복사"); b.type="button"; b.addEventListener("click", () => copy(String(v), val)); f.append(b); }
    else f.append(el("span"));
    return f;
  }

  async function saveImage(r){
    try {
      const res = await fetch(r.video || r.image); const blob = await res.blob();
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
      a.download = `${r.name || "소재"}.${r.video ? "mp4" : "jpg"}`; document.body.append(a); a.click();
      setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    } catch(e){ toast("다운로드 실패"); }
  }

  function card(r){
    const c = el("article","card");
    if (r.image){ const a = el("button","thumb"); a.type = "button"; a.setAttribute("aria-label", "확대 " + (r.name || "")); const im = new Image(); im.src = r.image; im.alt = r.name || ""; im.loading = "lazy"; a.append(im); a.addEventListener("click", () => openLb(r)); c.append(a); }
    const tags = el("div","tags");
    [r.channel, r.gender, r.ratio].filter(Boolean).forEach(t => tags.append(el("span","tag",t)));
    c.append(tags);
    c.append(field("광고 계정", r.account, {copy:false, empty:"미정"}));
    c.append(field("캠페인 · 광고세트", r.campaign));
    c.append(field("소재명", r.name, {b:true}));
    const two = el("div","two");
    two.append(field("게시일", r.start, {copy:false, empty:"미정"}), field("종료일", r.end, {copy:false, empty:"미정"}));
    c.append(two);
    c.append(field("예산", r.budget, {copy:false}));
    c.append(field("기본 텍스트", r.text, {empty:"피드 문구 미첨부"}));
    const two2 = el("div","two");
    two2.append(field("헤드라인", r.headline), field("CTA", r.cta, {copy:false}));
    c.append(two2);
    c.append(field("랜딩 URL", r.url));
    return c;
  }

  let lbRow = null;
  function openLb(r){ lbRow = r; const lb = $("#lb"); const v = $("#lb-vid"), im = $("#lb-img"); if (r.video){ im.hidden = true; v.hidden = false; v.src = r.video; v.play().catch(()=>{}); } else { v.pause(); v.hidden = true; v.removeAttribute("src"); im.hidden = false; im.src = r.image; } im.alt = r.name || ""; $("#lb-name").textContent = r.name || ""; lb.hidden = false; $("#lb-dl").focus(); }
  function closeLb(){ $("#lb").hidden = true; $("#lb-vid").pause(); lbRow = null; }
  $("#lb-close").addEventListener("click", closeLb);
  $("#lb-dl").addEventListener("click", () => lbRow && saveImage(lbRow));
  $("#lb").addEventListener("click", e => { if (e.target.id === "lb") closeLb(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#lb").hidden) closeLb(); });

  function render(){
    const list = $("#list"); list.textContent = "";
    const shown = rows.filter(r => !gender || r.gender === gender);
    const days = [...new Set(shown.map(r => r.date))].sort().reverse();
    const jump = $("#jump"); jump.textContent = "";
    if (!days.includes(day)) day = days[0] || "";
    days.forEach(d => { const n = shown.filter(r => r.date === d).length; const b = el("button","btn",`${fmtDay(d)} · ${n}`); b.type="button"; b.setAttribute("role","tab"); b.setAttribute("aria-pressed", String(d === day)); b.addEventListener("click", () => { day = d; render(); }); jump.append(b); });
    if (!days.length){ list.append(el("p","state","등록된 소재 없음")); return; }
    [day].forEach(d => {
      const items = shown.filter(r => r.date === d).sort((a,b) => { const g = x => x.gender === "남성" ? 0 : x.gender === "여성" ? 1 : 2; return g(a) - g(b) || (a.order ?? 0) - (b.order ?? 0); });
      const sec = el("section","day"); sec.id = "d-"+d;
      const h = el("div","dayhead");
      h.append(el("h2",null,fmtDay(d)));
      h.append(el("span","meta",`소재 ${items.length}개`));
      sec.append(h);
      const g = el("div","grid"); items.forEach(r => g.append(card(r))); sec.append(g);
      list.append(sec);
    });
  }

  function summary(){
    const days = [...new Set(rows.map(r => r.date))].sort();
    $("#s-last").textContent = days.length ? fmtDay(days[days.length-1]) : "-";
    $("#s-total").textContent = `소재 ${rows.length}개 · ${days.length}일`;
  }

  $("#f-gender").addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    gender = b.dataset.g;
    $("#f-gender").querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  });

  rows = [{"account": "MB 메타광고 MKT 계정 (TBH GLOBAL_MKT · 2253435635143172)", "budget": "일 3만원 (기존과 동일)", "campaign": "261110~1115_MB_롯데ON_랜딩트래픽(adv)_IG_2IMG_프로모션_남녀25~44 (기존 광고세트, 소재만 교체)", "channel": "롯데ON", "cta": "더 알아보기", "date": "2026-11-18", "end": "12/31(목)", "flag": "", "gender": "남성", "headline": "롯데ON 마인드브릿지 26 WINTER", "image": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/6xaJSlACEQAAAAEAABZ/anVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAFllqdW1iAAAAR2p1bWRjMm1hABEAEIAAAKoAOJtxA3VybjpjMnBhOjU3YWJlMmMwLTRmOTgtNGFmYy1hNjY3LTdiNDlmMDM1MmZiMAAAAAOUanVtYgAAAClqdW1kYzJhcwARABCAAACqADibcQNjMnBhLmFzc2VydGlvbnMAAAAAuWp1bWIAAABEanVtZGNib3IAEQAQgAAAqgA4m3ETYzJwYS5pbmdyZWRpZW50LnYzAAAAABhjMnNoJXIXWR/jXUdVtd42t2tSrwAAAG1jYm9yo2lkYzpmb3JtYXRqaW1hZ2UvanBlZ2ppbnN0YW5jZUlEeCx4bXA6aWlkOmQ5OGZkZGJiLWU5OTMtNDQyNi1iNjkxLTY1MDk2NjFmMDAwOGxyZWxhdGlvbnNoaXBocGFyZW50T2YAAAHianVtYgAAAEFqdW1kY2JvcgARABCAAACqADibcRNjMnBhLmFjdGlvbnMudjIAAAAAGGMyc2i2BeyPZ2xBShNw8ugLY9nwAAABmWNib3KiZ2FjdGlvbnOComZhY3Rpb25rYzJwYS5vcGVuZWRqcGFyYW1ldGVyc6FraW5ncmVkaWVudHOBomN1cmx4LXNlbGYjanVtYmY9YzJwYS5hc3NlcnRpb25zL2MycGEuaW5ncmVkaWVudC52M2RoYXNoWCCFL5xARGMcnO0zOclgknEjHan4NwGr8JAKQWWS9h8WfaRmYWN0aW9ueB1jb20uYW50aHJvcGljLmNsYXVkZS5wcm92aWRlZGpwYXJhbWV0ZXJzoXgfY29tLmFudGhyb3BpYy5vcmlnaW4tY29uZmlkZW5jZWd1bmtub3dua2Rlc2NyaXB0aW9ueGZDbGF1ZGUgcHJvdmlkZWQgdGhpcyBmaWxlIGF0IHRoZSByZXF1ZXN0IG9mIGEgdXNlciBhbmQgbWF5IGhhdmUgY3JlYXRlZCBvciBtb2RpZmllZCB0aGUgZmlsZSBjb250ZW50cy5tc29mdHdhcmVBZ2VudKFkbmFtZWZDbGF1ZGVyYWxsQWN0aW9uc0luY2x1ZGVk9QAAAMhqdW1iAAAAQGp1bWRjYm9yABEAEIAAAKoAOJtxE2MycGEuaGFzaC5kYXRhAAAAABhjMnNo/N8ndjvgi+xYqKEKQ48sIgAAAIBjYm9ypWNhbGdmc2hhMjU2Y3BhZE4AAAAAAAAAAAAAAAAAAGRoYXNoWCDcMUJiA3eHndGaiTlwKmzyDSi3nfVGLuv2pG41KRcW5GRuYW1lbmp1bWJmIG1hbmlmZXN0amV4Y2x1c2lvbnOBomVzdGFydBRmbGVuZ3RoGRaLAAACPmp1bWIAAAAnanVtZGMyY2wAEQAQgAAAqgA4m3EDYzJwYS5jbGFpbS52MgAAAAIPY2JvcqVjYWxnZnNoYTI1NmlzaWduYXR1cmV4TXNlbGYjanVtYmY9L2MycGEvdXJuOmMycGE6NTdhYmUyYzAtNGY5OC00YWZjLWE2NjctN2I0OWYwMzUyZmIwL2MycGEuc2lnbmF0dXJlamluc3Rh
